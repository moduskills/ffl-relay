on:
  schedule:
    - cron: "7 * * * *" # hourly (offset to avoid the top-of-hour Actions rush)
  workflow_dispatch:
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-and-push.mjs
        env:
          SETUP_KEY: ${{ secrets.SETUP_KEY }}
