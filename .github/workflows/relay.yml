name: fpl-relay
on:
  schedule:
    - cron: "7 * * * *" # hourly (offset to avoid the top-of-hour Actions rush)
  workflow_dispatch:
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.49
      - run: npx playwright install chromium --with-deps
      - run: node fetch-and-push.mjs
        env:
          SETUP_KEY: ${{ secrets.SETUP_KEY }}
          FPL_EMAIL: ${{ secrets.FPL_EMAIL }}
          FPL_PASS: ${{ secrets.FPL_PASS }}
